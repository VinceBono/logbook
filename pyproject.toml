[project]
name = "logbook"
version = "0.1.0.dev0"
description = "A private, on-device record of which apps you used and when, searchable by an AI agent. No screenshots, no keystrokes."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Vince Bono" }]
dependencies = ["mcp>=2.3"]

[project.scripts]
logbook = "logbook.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/logbook"]
